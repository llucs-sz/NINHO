<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ninho Psicologia</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo e Título -->
            <div class="auth-header">
                <img src="../img/ninho.png" alt="Ninho" class="auth-logo">
                <h1>NINHO PSICOLOGIA</h1>
                <p>Cadastro Profissional</p>
            </div>

            <!-- Formulário de Cadastro -->
            <form id="form-cadastro" class="auth-form">
                <div class="form-group">
                    <label for="nome">👤 Seu Nome Completo</label>
                    <input type="text" id="nome" name="nome" required 
                           pattern="[A-Za-zÀ-ÿ\s]{2,}" 
                           title="Digite apenas letras (mínimo 2 caracteres)">
                </div>

                <div class="form-group">
                    <label for="nascimento">📅 Data de Nascimento</label>
                    <input type="text" id="nascimento" name="nascimento" 
                           placeholder="dd/mm/aaaa" required
                           pattern="\d{2}/\d{2}/\d{4}" 
                           title="Digite no formato dd/mm/aaaa">
                </div>

                <div class="form-group">
                    <label for="registro">🏥 Registro Profissional (CRP)</label>
                    <input type="text" id="registro" name="registro" required
                           placeholder="Ex: CRP 05/12345"
                           pattern="[A-Za-z0-9/\s]{5,}"
                           title="Digite seu registro profissional">
                </div>

                <div class="form-group">
                    <label for="especialidade">🎯 Especialidade</label>
                    <select id="especialidade" name="especialidade" required>
                        <option value="">Selecione sua especialidade</option>
                        <option value="infantil">Psicologia Infantil</option>
                        <option value="clinica">Psicologia Clínica</option>
                        <option value="escolar">Psicologia Escolar</option>
                        <option value="hospitalar">Psicologia Hospitalar</option>
                        <option value="outra">Outra</option>
                    </select>
                </div>

                <div class="form-group">
<div class="form-group">
    <label>🏢 Instituição/Local de Trabalho</label>
    <div class="categorias-instituicoes">
        <!-- Hospitais -->
        <div class="categoria-item">
            <label for="hospital">🏥 Hospital</label>
            <select id="hospital" class="select-instituicao">
                <option value="">Selecione um hospital</option>
                <option value="Hospital Albert Einstein">Hospital Albert Einstein</option>
                <option value="Hospital Sírio-Libanês">Hospital Sírio-Libanês</option>
                <option value="Hospital das Clínicas">Hospital das Clínicas</option>
                <option value="Hospital Santa Catarina">Hospital Santa Catarina</option>
                <option value="Hospital São Lucas">Hospital São Lucas</option>
                <option value="Hospital Infantil">Hospital Infantil</option>
                <option value="outro_hospital">Outro hospital</option>
            </select>
            <input type="text" id="outro-hospital" class="outro-input" placeholder="Digite outro hospital" style="display: none;">
        </div>

        <!-- Clínicas -->
        <div class="categoria-item">
            <label for="clinica">🏩 Clínica</label>
            <select id="clinica" class="select-instituicao">
                <option value="">Selecione uma clínica</option>
                <option value="Clínica Psicológica Integrada">Clínica Psicológica Integrada</option>
                <option value="Clínica Bem Estar">Clínica Bem Estar</option>
                <option value="Clínica Cuidar">Clínica Cuidar</option>
                <option value="Clínica Vida Plena">Clínica Vida Plena</option>
                <option value="Clínica Espaço Terapêutico">Clínica Espaço Terapêutico</option>
                <option value="Clínica Saúde Mental">Clínica Saúde Mental</option>
                <option value="outro_clinica">Outra clínica</option>
            </select>
            <input type="text" id="outro-clinica" class="outro-input" placeholder="Digite outra clínica" style="display: none;">
        </div>

        <!-- Consultórios -->
        <div class="categoria-item">
            <label for="consultorio">🏠 Consultório</label>
            <select id="consultorio" class="select-instituicao">
                <option value="">Selecione um consultório</option>
                <option value="Consultório Particular - Dr(a). Silva">Consultório Particular - Dr(a). Silva</option>
                <option value="Consultório Particular - Centro">Consultório Particular - Centro</option>
                <option value="Consultório Particular - Zona Sul">Consultório Particular - Zona Sul</option>
                <option value="Consultório Particular - Zona Norte">Consultório Particular - Zona Norte</option>
                <option value="Consultório Particular - Taguatinga">Consultório Particular - Taguatinga</option>
                <option value="Consultório Multiprofissional">Consultório Multiprofissional</option>
                <option value="outro_consultorio">Outro consultório</option>
            </select>
            <input type="text" id="outro-consultorio" class="outro-input" placeholder="Digite outro consultório" style="display: none;">
        </div>
    </div>
    <input type="hidden" id="instituicao" name="instituicao" required>
    <small>Selecione uma opção em uma das categorias</small>
</div>
                <div class="form-group">
                    <label for="senha">🔒 Senha</label>
                    <input type="password" id="senha" name="senha" required
                           maxlength="12" minlength="6"
                           pattern=".{6,12}"
                           title="Senha deve ter entre 6 e 12 caracteres">
                    <small>Máximo 12 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">✅ Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                </div>

                <button type="submit" class="btn-primary btn-large">Cadastrar</button>
            </form>

            <!-- Link para Login -->
            <div class="auth-footer">
                <p>Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
