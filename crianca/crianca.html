<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tela de Jogos</title>
  <link rel="stylesheet" href="crianca.css" />
</head>
<body>
  <div class="page">
    <header class="top-area">
      <div class="mascote-area">
        <img src="../img/ninho.png" alt="Ninho" class="mascote" />
        <div class="fala">Oi! Vamos aprender brincando?</div>
      </div>
    </header>

    <main class="container">
      <section class="botoes">
        <div class="bloco" id="bloco-pode">
          <img src="../img/image-removebg.png.png" alt="Pode ou Não Pode" class="icone" />
          <button class="btn vermelho" id="podeBtn">PODE OU<br/>NÃO PODE</button>
        </div>

        <div class="bloco" id="bloco-historia">
          <img src="../img/image-removebg-preview (5).png" alt="Complete a História" class="icone" />
          <button class="btn azul" id="historiaBtn">COMPLETE A<br/>HISTÓRIA</button>
        </div>

        <div class="bloco" id="bloco-memoria">
          <img src="../img/image-removebg-preview (2).png" alt="Jogo da Memória" class="icone" />
          <button class="btn amarelo" id="memoriaBtn">JOGO DA<br/>MEMÓRIA</button>
        </div>
      </section>
    </main>
  </div>

  <script src="crianca.js"></script>
</body>
</html>
